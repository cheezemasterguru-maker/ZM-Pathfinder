<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lost Temple — Template Recorder</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#edf0f6;background:#111722}
*{box-sizing:border-box}body{margin:0}
header{background:#1c2738;border-bottom:1px solid #36465b;padding:14px 18px}
h1{font-size:1.25rem;margin:0}h2{font-size:1rem;margin:0 0 10px}
small,.muted{color:#aebdd0}
main{max-width:1250px;margin:auto;padding:14px;display:grid;grid-template-columns:minmax(300px,1fr) minmax(280px,380px);gap:14px}
.panel{background:#1b2636;border:1px solid #34465b;border-radius:12px;padding:14px;min-width:0}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:8px 0}
label{font-size:.82rem;color:#c9d4e3;display:grid;gap:4px}
select,input,button{background:#29384c;color:#f3f7ff;border:1px solid #536981;border-radius:7px;padding:8px;font:inherit}
button{cursor:pointer}button:hover:not(:disabled){background:#38516d}
button:disabled{opacity:.38;cursor:not-allowed}button.active{outline:2px solid #6acbff;background:#345779}
button.primary{background:#136b9c}button.danger{background:#713a43}
.gridwrap{overflow:auto;padding:4px}.board{--cols:4;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:3px;max-width:620px;margin:8px auto}
.cell{aspect-ratio:1;min-width:0;padding:0;position:relative;border:2px solid #927447;background:#cba56d;border-radius:4px;color:#fff;display:grid;place-items:center;font-size:clamp(10px,1.7vw,17px);font-weight:700;text-shadow:0 1px 2px #111}
.cell.placed{border-color:#f4f5ff}.cell.selected{outline:3px solid #70d7ff;z-index:2}
.cell .coord{position:absolute;bottom:2px;right:3px;font-size:9px;opacity:.75}
.palette{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.piece{display:flex;gap:8px;align-items:center;text-align:left;font-size:.8rem;min-width:0}
.swatch{width:28px;height:28px;flex:none;border-radius:5px;border:1px solid #ffffff66}
.status{padding:9px;border-radius:8px;background:#12202f;white-space:pre-wrap;line-height:1.4;font-size:.82rem}
.status.error{background:#482b35;color:#ffced4}.status.good{background:#1a453a;color:#b9ffe0}
#screenshot{max-width:100%;max-height:380px;object-fit:contain;display:none;margin:8px auto;border:1px solid #536981}
#saved{max-height:210px;overflow:auto}#saved button{width:100%;text-align:left;margin:3px 0}
@media(max-width:800px){main{grid-template-columns:1fr}.board{max-width:520px}.cell{font-size:13px}}
</style>
</head>
<body>
<header><h1>Lost Temple · Template Recorder</h1></header>

<main>
<section class="panel">
  <h2>Board</h2>

  <div class="controls">
    <label>Game version
      <select id="version">
        <option value="5">5-puzzle version</option>
        <option value="6">6-puzzle version</option>
      </select>
    </label>
    <label>Level<select id="level"></select></label>
    <label id="dimensionsLabel" style="display:none">Grid dimensions
      <select id="dimensions">
        <option value="7x6">7 wide × 6 high</option>
        <option value="7x8">7 wide × 8 high</option>
      </select>
    </label>
    <label>Template name<input id="name" maxlength="100" placeholder="Optional name"></label>
  </div>

  <div class="controls">
    <button id="rotate">Rotate selected piece ↻</button>
    <button id="undo">Undo</button>
    <button id="clear" class="danger">Clear board</button>
    <button id="save" class="primary">Save template</button>
  </div>

  <div class="gridwrap"><div id="board" class="board" aria-label="Template grid"></div></div>
  <div id="status" class="status"></div>
</section>

<aside>
  <section class="panel">
    <h2>Pieces</h2>
    <div id="palette" class="palette"></div>
    <div class="controls"><button id="erase">Remove piece</button></div>
  </section>

  <section class="panel" style="margin-top:14px">
    <h2>Saved templates</h2>
    <div class="controls">
      <button id="export">Export server JSON</button>
      <button id="import">Import server JSON</button>
    </div>
    <input type="file" id="jsonfile" accept=".json,application/json" hidden>
    <div id="saved"></div>
  </section>

  <section class="panel" style="margin-top:14px">
    <h2>Reference screenshot</h2>
    <label>Open image locally<input id="photo" type="file" accept="image/*"></label>
    <img id="screenshot" alt="Local reference screenshot">
  </section>
</aside>
</main>

<script>
'use strict';

/*
  IMPORTANT:
  These are the exact internal piece names used by the current Lost Temple
  templates.js library. Do not change them casually; familyId and duplicate
  detection depend on them.

  Legacy recorder names are migrated automatically:
    blue -> Blue
    green -> Green
    yellow -> Yellow
    purpleLight -> Pink
    purple -> Purple
    cyan -> Light Blue
    orange -> Orange
    red -> Red
    blueRed -> Blue/Red
*/
const TYPES={
  "Blue":       {label:"Blue",       w:2,h:1,fill:"#277edc"},
  "Green":      {label:"Green",      w:3,h:1,fill:"#26a957"},
  "Yellow":     {label:"Yellow",     w:2,h:2,fill:"#e5b52c"},
  "Pink":       {label:"Pink",       w:3,h:2,fill:"#D946C6"},
  "Purple":     {label:"Purple",     w:3,h:3,fill:"#883ed1"},
  "Light Blue": {label:"Light Blue", w:1,h:1,fill:"#68d5ec"},
  "Orange":     {label:"Orange",     w:5,h:1,fill:"linear-gradient(120deg,#ffce39,#f58b20)"},
  "Red":        {label:"Red",        w:4,h:2,fill:"#d74b46"},
  "Blue/Red":   {label:"Blue/Red",   w:4,h:4,fill:"linear-gradient(135deg,#2e7dd9 0%,#4b80d0 40%,#a44f85 65%,#df5347 100%)"}
};

/*
  These inventories match the current recorder/solver structure:
  5-puzzle:
    L1 4x4
    L2 5x5
    L3 6x6
    L4 7x6
    L5 final 8x8
  6-puzzle:
    L1 4x4
    L2 5x5
    L3 6x6
    L4 7x8
    L5 8x8 purple configuration
    L6 8x8 final configuration
*/
const CONFIG={
  common:{
    1:{cols:4,rows:4,pieces:{"Blue":2,"Green":1,"Yellow":1}},
    2:{cols:5,rows:5,pieces:{"Blue":2,"Green":2,"Pink":1}},
    3:{cols:6,rows:6,pieces:{"Pink":2,"Yellow":2,"Blue":1,"Light Blue":1}},
    4:{cols:7,rows:6,pieces:{"Pink":2,"Yellow":2,"Blue":1,"Green":2}}
  },
  purpleFinal:{cols:8,rows:8,pieces:{"Purple":2,"Yellow":2,"Green":2,"Blue":1}},
  final:{cols:8,rows:8,pieces:{"Green":2,"Blue":2,"Orange":2,"Red":1,"Blue/Red":1}}
};

const LEGACY_TYPE_MAP={
  blue:"Blue",Blue:"Blue",
  green:"Green",Green:"Green",
  yellow:"Yellow",Yellow:"Yellow",
  purpleLight:"Pink","Light purple":"Pink",Pink:"Pink",
  purple:"Purple",Purple:"Purple",
  cyan:"Light Blue","Light blue":"Light Blue","Light Blue":"Light Blue",
  orange:"Orange","Orange / yellow":"Orange",Orange:"Orange",
  red:"Red",Red:"Red",
  blueRed:"Blue/Red","Blue / red":"Blue/Red","Blue/Red":"Blue/Red"
};

const TRANSFORMATION_NAMES=[
  "Original","Mirror left/right","Mirror top/bottom","Rotate 180°",
  "Rotate 90° clockwise","Rotate 90° counterclockwise",
  "Mirror diagonal","Mirror anti-diagonal"
];

const $=id=>document.getElementById(id);

let version="5";
let level=1;
let dimensions="7x6";
let placed=[];
let selected="Blue";
let rotated=false;
let history=[];
let library=[];
let migrationMessage="";

function readLibrary(){
  try{
    const raw=localStorage.getItem("lt_verified_templates_v1");
    const data=raw?JSON.parse(raw):[];
    return Array.isArray(data)?data:[];
  }catch(e){
    migrationMessage="Existing local template data could not be parsed. A backup was not modified.";
    return [];
  }
}

/* Save a byte-for-byte backup before touching existing local data. */
function backupLocalLibrary(raw){
  if(raw===null)return;
  const stamp=new Date().toISOString().replace(/[:.]/g,"-");
  const key="lt_verified_templates_v1_backup_"+stamp;
  try{
    localStorage.setItem(key,raw);
    localStorage.setItem("lt_verified_templates_v1_last_backup",key);
  }catch(e){}
}

function normalizeType(type){
  if(type==null)return null;
  return LEGACY_TYPE_MAP[String(type).trim()]||null;
}

function config(v=version,l=level,d=dimensions){
  if(l<=4){
    const base=CONFIG.common[l];
    if(v==="6"&&l===4&&d==="7x8")return {
      cols:7,rows:8,
      pieces:{"Pink":2,"Yellow":2,"Blue":1,"Green":2}
    };
    return base;
  }
  if(v==="5")return CONFIG.final;
  return l===5?CONFIG.purpleFinal:CONFIG.final;
}

function dimensionsUI(){
  const enabled=version==="6"&&level===4;
  $("dimensionsLabel").style.display=enabled?"grid":"none";
  $("dimensions").value=dimensions;
}

function count(type){
  return placed.filter(p=>p.type===type).length;
}

function footprint(p){
  const t=TYPES[p.type];
  if(!t)return {w:0,h:0,cells:[]};
  const w=p.rotated?t.h:t.w;
  const h=p.rotated?t.w:t.h;
  const cells=[];
  for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++)cells.push([p.x+xx,p.y+yy]);
  return {w,h,cells};
}

function occupied(){
  const m=new Map();
  placed.forEach((p,i)=>footprint(p).cells.forEach(([x,y])=>m.set(x+","+y,i)));
  return m;
}

function snapshot(){
  history.push(JSON.stringify(placed));
  if(history.length>100)history.shift();
}

function choose(type){
  selected=type;
  rotated=false;
  render();
}

function render(){
  const cfg=config();
  $("board").style.setProperty("--cols",cfg.cols);
  const m=occupied(),b=$("board");
  b.innerHTML="";

  for(let y=0;y<cfg.rows;y++){
    for(let x=0;x<cfg.cols;x++){
      const cell=document.createElement("button");
      cell.type="button";
      cell.className="cell";
      const idx=m.get(x+","+y);
      if(idx!==undefined){
        const p=placed[idx],t=TYPES[p.type];
        cell.classList.add("placed");
        cell.style.background=t.fill;
        cell.title=t.label+" piece";
      }else{
        cell.title=String.fromCharCode(65+x)+(y+1);
      }
      cell.innerHTML='<span class="coord">'+String.fromCharCode(65+x)+(y+1)+"</span>";
      cell.addEventListener("click",()=>clickCell(x,y));
      b.appendChild(cell);
    }
  }

  const pal=$("palette");
  pal.innerHTML="";
  Object.entries(cfg.pieces).forEach(([type,qty])=>{
    const t=TYPES[type],n=count(type);
    const btn=document.createElement("button");
    btn.className="piece"+(selected===type?" active":"");
    btn.disabled=n>=qty&&selected!==type;
    btn.innerHTML='<span class="swatch"></span><span>'+t.label+
      '<br><small>'+t.w+"×"+t.h+" · "+n+"/"+qty+" placed</small></span>";
    btn.querySelector(".swatch").style.background=t.fill;
    btn.onclick=()=>choose(type);
    pal.appendChild(btn);
  });

  $("erase").classList.toggle("active",selected==="erase");

  const valid=validate();
  $("status").className="status "+(valid.complete?"good":"");
  $("status").textContent=valid.message+(migrationMessage?"\n"+migrationMessage:"");

  $("rotate").disabled=selected==="erase"||!TYPES[selected]||
    TYPES[selected].w===TYPES[selected].h;
  $("rotate").textContent="Rotate selected piece ↻"+(rotated?" (rotated)":"");
  $("undo").disabled=!history.length;

  renderSaved();
}

function clickCell(x,y){
  const cfg=config(),m=occupied(),i=m.get(x+","+y);

  if(i!==undefined){
    snapshot();
    placed.splice(i,1);
    render();
    return;
  }

  if(selected==="erase")return;
  if(!cfg.pieces[selected]||count(selected)>=cfg.pieces[selected])return;

  const p={type:selected,x,y,rotated};
  const f=footprint(p);

  if(f.cells.some(([a,b])=>
    a<0||b<0||a>=cfg.cols||b>=cfg.rows||m.has(a+","+b)
  )){
    return;
  }

  snapshot();
  placed.push(p);
  render();
}

function validate(){
  const cfg=config();
  const m=new Set();

  for(const p of placed){
    if(!(p.type in cfg.pieces))
      return {complete:false,message:"Invalid piece type for this level."};

    for(const [x,y] of footprint(p).cells){
      const key=x+","+y;
      if(x<0||y<0||x>=cfg.cols||y>=cfg.rows||m.has(key))
        return {complete:false,message:"Invalid placement: overlap or outside grid."};
      m.add(key);
    }
  }

  const missing=Object.entries(cfg.pieces)
    .filter(([type,n])=>count(type)!==n)
    .map(([type,n])=>TYPES[type].label+": "+count(type)+"/"+n);

  if(missing.length)
    return {complete:false,message:"Incomplete — "+missing.join(" · ")};

  return {
    complete:true,
    message:"VALID COMPLETE BOARD — "+placed.length+" pieces, "+
      m.size+" occupied cells, "+(cfg.cols*cfg.rows-m.size)+
      " empty cells. Ready to save."
  };
}

/*
  A canonical familyId describes the actual piece footprints, independent
  of the piece's top-left anchor or rotated flag. This is the same conceptual
  family representation used by the solver's templates.js.
*/
function familyIdFor(pieces,cols,rows){
  const kinds=cols===rows?[0,1,2,3,4,5,6,7]:[0,1,2,3];

  return kinds.map(k=>{
    const groups=pieces.map(p=>{
      const cells=footprint(p).cells
        .map(c=>transformCell(c,cols,rows,k))
        .sort((a,b)=>a[1]-b[1]||a[0]-b[0]);

      return p.type+":"+cells.map(([x,y])=>x+","+y).join(";");
    });

    return groups.sort().join("|");
  }).sort()[0];
}

function transformCell([x,y],cols,rows,k){
  switch(k){
    case 0:return [x,y];
    case 1:return [cols-1-x,y];
    case 2:return [x,rows-1-y];
    case 3:return [cols-1-x,rows-1-y];
    case 4:return [y,cols-1-x];
    case 5:return [rows-1-y,x];
    case 6:return [y,x];
    case 7:return [rows-1-y,cols-1-x];
  }
}

function transformPieces(pieces,cols,rows,k){
  const out=[];
  for(const p of pieces){
    const cells=footprint(p).cells.map(c=>transformCell(c,cols,rows,k));
    const minX=Math.min(...cells.map(c=>c[0]));
    const minY=Math.min(...cells.map(c=>c[1]));
    const maxX=Math.max(...cells.map(c=>c[0]));
    const maxY=Math.max(...cells.map(c=>c[1]));
    const bw=maxX-minX+1;
    const bh=maxY-minY+1;
    const t=TYPES[p.type];
    let isRotated=p.rotated;
    if(t.w!==t.h){
      if(bw===t.h&&bh===t.w)isRotated=true;
      else if(bw===t.w&&bh===t.h)isRotated=false;
    }else{
      isRotated=false;
    }
    out.push({type:p.type,x:minX,y:minY,rotated:isRotated});
  }
  return out;
}

/*
  Duplicate signature:
  - square board: all 8 dihedral transformations
  - rectangular board: only transformations that keep the same dimensions
    (LR, TB, 180, plus original)
*/
function signature(pieces,cfg){
  const kinds=cfg.cols===cfg.rows?[0,1,2,3,4,5,6,7]:[0,1,2,3];
  return kinds.map(k=>{
    const transformed=transformPieces(pieces,cfg.cols,cfg.rows,k);
    return transformed.map(p=>{
      const cells=footprint(p).cells.map(([x,y])=>x+","+y).sort();
      return p.type+":"+cells.join(";");
    }).sort().join("|");
  }).sort()[0];
}

function makeTemplate(pieces,name,v,l,cols,rows,transformation){
  const copy=pieces.map(p=>({...p}));
  return {
    id:"lt-"+Date.now()+"-"+Math.random().toString(36).slice(2,8),
    name,
    version:v,
    level:l,
    cols,
    rows,
    pieces:copy,
    recordedAt:new Date().toISOString(),
    familyId:familyIdFor(copy,cols,rows),
    transformation:transformation||"Original"
  };
}

function storage(){
  localStorage.setItem("lt_verified_templates_v1",JSON.stringify(library));
}

function renderSaved(){
  const cfg=config();
  const list=library.filter(t=>
    String(t.version)===version&&Number(t.level)===level&&
    Number(t.cols)===cfg.cols&&Number(t.rows)===cfg.rows
  );
  const el=$("saved");
  el.innerHTML="<p class=\"muted\">"+list.length+
    " saved for this version/level/grid · "+library.length+" total</p>";

  list.forEach(t=>{
    const btn=document.createElement("button");
    btn.textContent=t.name+" · "+String(t.id).slice(-6);
    btn.onclick=()=>{
      placed=structuredClone(t.pieces);
      history=[];
      $("name").value=t.name||"";
      render();
    };
    el.appendChild(btn);
  });
}

/*
  Migrate every existing local template before the new recorder starts.
  The original raw value is backed up first. Existing IDs/names/timestamps
  are retained. Piece identifiers and derived family IDs are corrected.
  Duplicate symmetry-equivalents are removed only from the active library;
  the exact pre-migration library remains in the backup.
*/
function migrateLibrary(){
  const raw=localStorage.getItem("lt_verified_templates_v1");
  if(raw===null)return [];

  backupLocalLibrary(raw);

  let old;
  try{old=JSON.parse(raw)}catch{return []}
  if(!Array.isArray(old))return [];

  let migrated=0,duplicates=0,unknown=0;
  const result=[];
  const seen=new Set();

  for(const original of old){
    if(!original||!Array.isArray(original.pieces))continue;

    const t=structuredClone(original);
    const normalized=[];

    for(const p of t.pieces){
      const type=normalizeType(p.type);
      if(!type){
        unknown++;
        normalized.push(p);
        continue;
      }
      normalized.push({
        type,
        x:Number(p.x),
        y:Number(p.y),
        rotated:Boolean(p.rotated)
      });
      if(type!==p.type)migrated++;
    }

    t.pieces=normalized;

    const cfg=config(String(t.version),Number(t.level),String(t.cols)+"x"+String(t.rows));

    if(cfg&&cfg.cols===Number(t.cols)&&cfg.rows===Number(t.rows)&&
       normalized.every(p=>TYPES[p.type])){
      t.familyId=familyIdFor(normalized,Number(t.cols),Number(t.rows));

      const sig=signature(normalized,cfg);
      const key=String(t.version)+"|"+Number(t.level)+"|"+Number(t.cols)+"x"+
        Number(t.rows)+"|"+sig;

      if(seen.has(key)){
        duplicates++;
        continue;
      }
      seen.add(key);
    }

    if(!t.transformation)t.transformation="Original";
    result.push(t);
  }

  library=result;
  storage();

  migrationMessage="Local library migrated: "+migrated+
    " piece identifiers corrected; "+duplicates+
    " rotated/mirrored duplicates removed; "+unknown+
    " unknown piece identifiers preserved in the backup.";
  return result;
}

function levels(){
  const max=version==="5"?5:6;
  $("level").innerHTML=Array.from({length:max},(_,i)=>{
    const l=i+1;
    const c=config(version,l,l===4&&version==="6"?"7x8":"7x6");
    return '<option value="'+l+'">Level '+l+
      " ("+c.cols+"×"+c.rows+")</option>";
  }).join("");
  level=Math.min(level,max);
  $("level").value=level;
  dimensionsUI();
}

function reset(){
  placed=[];
  history=[];
  const cfg=config();
  selected=Object.keys(cfg.pieces)[0];
  rotated=false;
  render();
}

$("version").onchange=()=>{
  version=$("version").value;
  level=1;
  dimensions=version==="6"?"7x8":"7x6";
  levels();
  reset();
};

$("level").onchange=()=>{
  level=Number($("level").value);
  if(version==="6"&&level===4)dimensions="7x8";
  dimensionsUI();
  reset();
};

$("dimensions").onchange=()=>{
  dimensions=$("dimensions").value;
  reset();
};

$("rotate").onclick=()=>{
  if(selected==="erase"||!TYPES[selected])return;
  rotated=!rotated;
  render();
};

$("erase").onclick=()=>choose("erase");

$("undo").onclick=()=>{
  if(history.length){
    placed=JSON.parse(history.pop());
    render();
  }
};

$("clear").onclick=()=>{
  snapshot();
  placed=[];
  render();
};

$("photo").onchange=e=>{
  const file=e.target.files?.[0];
  if(!file)return;
  const img=$("screenshot");
  if(img.dataset.url)URL.revokeObjectURL(img.dataset.url);
  img.dataset.url=URL.createObjectURL(file);
  img.src=img.dataset.url;
  img.style.display="block";
};

$("save").onclick=()=>{
  const v=validate();
  if(!v.complete)return;

  const cfg=config();
  const sig=signature(placed,cfg);

  const duplicate=library.some(t=>
    String(t.version)===version&&Number(t.level)===level&&
    Number(t.cols)===cfg.cols&&Number(t.rows)===cfg.rows&&
    signature(t.pieces,cfg)===sig
  );

  if(duplicate){
    $("status").className="status error";
    $("status").textContent="DUPLICATE — this template already exists in this orientation, rotation, or mirror.";
    return;
  }

  const name=$("name").value.trim()||
    "Template "+(library.length+1);

  const template=makeTemplate(
    placed,name,version,level,cfg.cols,cfg.rows,"Original"
  );

  try{
    library.push(template);
    storage();
    render();
  }catch(e){
    library.pop();
    $("status").className="status error";
    $("status").textContent="Browser storage failed: "+e.message;
  }
};

/*
  Export is already the solver's JSON format. Nothing needs to be converted
  before upload.
*/
$("export").onclick=()=>{
  const payload={
    schema:"lost-temple-templates-v1",
    templates:library
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{
    type:"application/json"
  });
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="lost-temple-templates.json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};

$("import").onclick=()=>$("jsonfile").click();

$("jsonfile").onchange=async e=>{
  const file=e.target.files?.[0];
  if(!file)return;

  try{
    const data=JSON.parse(await file.text());
    if(data.schema!=="lost-temple-templates-v1"||
       !Array.isArray(data.templates))
      throw Error("Unsupported Lost Temple template JSON.");

    let added=0,skipped=0;
    const existing=new Set();

    for(const t of library){
      try{
        const cfg=config(String(t.version),Number(t.level),
          String(t.cols)+"x"+String(t.rows));
        existing.add(String(t.version)+"|"+Number(t.level)+"|"+
          Number(t.cols)+"x"+Number(t.rows)+"|"+signature(t.pieces,cfg));
      }catch(e){}
    }

    for(const rawT of data.templates){
      if(!rawT||!Array.isArray(rawT.pieces)){skipped++;continue}

      const t=structuredClone(rawT);
      t.pieces=t.pieces.map(p=>({
        type:normalizeType(p.type)||p.type,
        x:Number(p.x),
        y:Number(p.y),
        rotated:Boolean(p.rotated)
      }));

      const cfg=config(String(t.version),Number(t.level),
        String(t.cols)+"x"+String(t.rows));

      if(!cfg||cfg.cols!==Number(t.cols)||cfg.rows!==Number(t.rows)||
         t.pieces.some(p=>!TYPES[p.type])){
        skipped++;
        continue;
      }

      const sig=signature(t.pieces,cfg);
      const key=String(t.version)+"|"+Number(t.level)+"|"+
        Number(t.cols)+"x"+Number(t.rows)+"|"+sig;

      if(existing.has(key)){
        skipped++;
        continue;
      }

      t.familyId=familyIdFor(t.pieces,Number(t.cols),Number(t.rows));
      if(!t.transformation)t.transformation="Original";
      if(!t.id)t.id="lt-"+Date.now()+"-"+Math.random().toString(36).slice(2,8);
      if(!t.recordedAt)t.recordedAt=new Date().toISOString();

      library.push(t);
      existing.add(key);
      added++;
    }

    storage();
    render();
    $("status").className="status good";
    $("status").textContent="Imported "+added+
      " templates; skipped "+skipped+
      " invalid or duplicate entries.";
  }catch(err){
    $("status").className="status error";
    $("status").textContent="Import failed: "+err.message;
  }

  e.target.value="";
};

/* First-run migration. */
library=migrateLibrary();
levels();
reset();
</script>
