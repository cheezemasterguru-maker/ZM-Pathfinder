<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lost Temple — Template Recorder</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#edf0f6;background:#111722}
*{box-sizing:border-box}body{margin:0}
header{background:#1c2738;border-bottom:1px solid #36465b;padding:14px 18px}
h1{font-size:1.25rem;margin:0}h2{font-size:1rem;margin:0 0 10px}
small,.muted{color:#aebdd0}
main{max-width:1250px;margin:auto;padding:14px;display:grid;grid-template-columns:minmax(300px,1fr) minmax(280px,380px);gap:14px}
.panel{background:#1b2636;border:1px solid #34465b;border-radius:12px;padding:14px;min-width:0}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:8px 0}
label{font-size:.82rem;color:#c9d4e3;display:grid;gap:4px}
select,input,button{background:#29384c;color:#f3f7ff;border:1px solid #536981;border-radius:7px;padding:8px;font:inherit}
button{cursor:pointer}button:hover:not(:disabled){background:#38516d}
button:disabled{opacity:.38;cursor:not-allowed}button.active{outline:2px solid #6acbff;background:#345779}
button.primary{background:#136b9c}button.danger{background:#713a43}
.gridwrap{overflow:auto;padding:4px}.board{--cols:4;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:3px;max-width:620px;margin:8px auto}
.cell{aspect-ratio:1;min-width:0;padding:0;position:relative;border:2px solid #927447;background:#cba56d;border-radius:4px;color:#fff;display:grid;place-items:center;font-size:clamp(10px,1.7vw,17px);font-weight:700;text-shadow:0 1px 2px #111}
.cell.placed{border-color:#f4f5ff}.cell.selected{outline:3px solid #70d7ff;z-index:2}
.cell .coord{position:absolute;bottom:2px;right:3px;font-size:9px;opacity:.75}
.palette{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.piece{display:flex;gap:8px;align-items:center;text-align:left;font-size:.8rem;min-width:0}
.swatch{width:28px;height:28px;flex:none;border-radius:5px;border:1px solid #ffffff66}
.status{padding:9px;border-radius:8px;background:#12202f;white-space:pre-wrap;line-height:1.4;font-size:.82rem}
.status.error{background:#482b35;color:#ffced4}.status.good{background:#1a453a;color:#b9ffe0}
#screenshot{max-width:100%;max-height:380px;object-fit:contain;display:none;margin:8px auto;border:1px solid #536981}
#saved{max-height:210px;overflow:auto}#saved button{width:100%;text-align:left;margin:3px 0}
@media(max-width:800px){main{grid-template-columns:1fr}.board{max-width:520px}.cell{font-size:13px}}
</style>
</head>
<body>
<header><h1>Lost Temple · Template Recorder</h1></header>

<main>
<section class="panel">
  <h2>Board</h2>

  <div class="controls">
    <label>Game version
      <select id="version">
        <option value="5">5-puzzle version</option>
        <option value="6">6-puzzle version</option>
      </select>
    </label>
    <label>Level<select id="level"></select></label>
    <label id="dimensionsLabel" style="display:none">Grid dimensions
      <select id="dimensions">
        <option value="7x6">7 wide × 6 high</option>
        <option value="7x8">7 wide × 8 high</option>
      </select>
    </label>
    <label>Template name<input id="name" maxlength="100" placeholder="Optional name"></label>
  </div>

  <div class="panel" style="margin:0 0 12px 0;padding:10px">
    <h2>Pieces</h2>
    <div id="palette" class="palette"></div>
    <div class="controls">
      <button id="erase">Remove piece</button>
      <button id="rotate">Rotate selected piece ↻</button>
      <button id="undo">Undo</button>
      <button id="clear" class="danger">Clear board</button>
      <button id="save" class="primary">Save template</button>
    </div>
  </div>

  <div class="gridwrap"><div id="board" class="board" aria-label="Template grid"></div></div>
  <div id="status" class="status"></div>
</section>

<aside>
  <section class="panel">
    <h2>Saved templates</h2>
    <div class="controls">
      <button id="export">Export solver templates.js</button>
      <button id="import">Import solver templates</button>
    </div>
    <input type="file" id="jsonfile" accept=".json,.js,.txt,application/json,text/javascript,text/plain" hidden>
    <div id="saved"></div>
  </section>

  <section class="panel" style="margin-top:14px">
    <h2>Reference screenshot</h2>
    <label>Open image locally<input id="photo" type="file" accept="image/*"></label>
    <img id="screenshot" alt="Local reference screenshot">
  </section>
</aside>
</main>

<script>
"use strict";

const TYPES={
  "Blue":{w:2,h:1,color:"#277edc"},
  "Green":{w:3,h:1,color:"#26a957"},
  "Yellow":{w:2,h:2,color:"#e5b52c"},
  "Pink":{w:3,h:2,color:"#D946C6"},
  "Purple":{w:3,h:3,color:"#883ed1"},
  "Light Blue":{w:1,h:1,color:"#68d5ec"},
  "Orange":{w:5,h:1,color:"linear-gradient(90deg,#f59e0b,#f97316)"},
  "Red":{w:4,h:2,color:"#d74b46"},
  "Blue/Red":{w:4,h:4,color:"linear-gradient(135deg,#277edc 0 50%,#d74b46 50% 100%)"}
};

const CONFIG={
  "5":{
    1:{cols:4,rows:4,pieces:{Blue:2,Green:1,Yellow:1}},
    2:{cols:5,rows:5,pieces:{Blue:2,Green:2,Pink:1}},
    3:{cols:6,rows:6,pieces:{Pink:2,Yellow:2,Blue:1,"Light Blue":1}},
    4:{cols:7,rows:6,pieces:{Pink:2,Yellow:2,Blue:1,Green:2}},
    5:{cols:8,rows:8,pieces:{Green:2,Blue:2,Orange:2,Red:1,"Blue/Red":1}}
  },
  "6":{
    1:{cols:4,rows:4,pieces:{Blue:2,Green:1,Yellow:1}},
    2:{cols:5,rows:5,pieces:{Blue:2,Green:2,Pink:1}},
    3:{cols:6,rows:6,pieces:{Pink:2,Yellow:2,Blue:1,"Light Blue":1}},
    4:{cols:7,rows:6,pieces:{Pink:2,Yellow:2,Blue:1,Green:2}},
    5:{cols:8,rows:8,pieces:{Purple:2,Yellow:2,Green:2,Blue:1}},
    6:{cols:8,rows:8,pieces:{Purple:2,Yellow:2,Green:2,Blue:1}}
  }
};

const LEGACY_TYPE_MAP={
  blue:"Blue",green:"Green",yellow:"Yellow",purpleLight:"Pink",
  "Light purple":"Pink",pink:"Pink",purple:"Purple",cyan:"Light Blue",
  "Light blue":"Light Blue",lightBlue:"Light Blue",orange:"Orange",
  "Orange / yellow":"Orange",red:"Red",blueRed:"Blue/Red",
  "Blue / Red":"Blue/Red"
};

let library=[];
let state={version:"6",level:4,cols:7,rows:6,pieces:[],selectedId:null,history:[]};

const $=id=>document.getElementById(id);
const key=(version,level,cols,rows)=>`${version}|${level}|${cols}|${rows}`;

function config(){
  return CONFIG[state.version][state.level];
}
function dimensionsUI(){
  $("dimensionsLabel").style.display=(state.version==="6"&&state.level===4)?"grid":"none";
  if(state.version==="6"&&state.level===4){
    const [c,r]=$("dimensions").value.split("x").map(Number);
    state.cols=c;state.rows=r;
  }else{
    state.cols=config().cols;state.rows=config().rows;
  }
}
function count(type){
  return state.pieces.filter(p=>p.type===type).length;
}
function footprint(piece){
  const t=TYPES[piece.type];
  const w=piece.rotated?t.h:t.w;
  const h=piece.rotated?t.w:t.h;
  return {w,h};
}
function occupied(piece){
  const {w,h}=footprint(piece);
  const cells=[];
  for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++)cells.push({x:piece.x+dx,y:piece.y+dy});
  return cells;
}
function snapshot(){
  return JSON.parse(JSON.stringify(state.pieces));
}
function choose(type){
  const need=config().pieces[type]||0;
  if(count(type)>=need)return;
  saveHistory();
  const t=TYPES[type];
  const rotated=false;
  const w=t.w,h=t.h;
  let spot=null;
  for(let y=0;y<=state.rows-h&&!spot;y++){
    for(let x=0;x<=state.cols-w&&!spot;x++){
      const trial={id:crypto.randomUUID(),type,x,y,rotated};
      if(!state.pieces.some(p=>occupied(p).some(a=>occupied(trial).some(b=>a.x===b.x&&a.y===b.y))))spot={x,y};
    }
  }
  if(!spot){
    state.history.pop();
    setStatus("No open space is available for another "+type+".","error");
    return;
  }
  const piece={id:crypto.randomUUID(),type,x:spot.x,y:spot.y,rotated:false};
  state.pieces.push(piece);
  state.selectedId=piece.id;
  render();
}
function render(){
  $("board").style.setProperty("--cols",state.cols);
  $("board").innerHTML="";
  const byCell=new Map();
  for(const p of state.pieces){
    for(const c of occupied(p))byCell.set(`${c.x},${c.y}`,p);
  }
  for(let y=0;y<state.rows;y++)for(let x=0;x<state.cols;x++){
    const b=document.createElement("button");
    b.className="cell";
    const p=byCell.get(`${x},${y}`);
    if(p){
      b.classList.add("placed");
      if(p.id===state.selectedId)b.classList.add("selected");
      b.style.background=TYPES[p.type].color;
      b.textContent=p.type;
    }
    const coord=document.createElement("span");
    coord.className="coord";
    coord.textContent=`${x+1},${y+1}`;
    b.appendChild(coord);
    b.onclick=()=>clickCell(x,y);
    $("board").appendChild(b);
  }

  $("palette").innerHTML="";
  for(const [type,t] of Object.entries(TYPES)){
    const need=config().pieces[type]||0;
    if(!need)continue;
    const b=document.createElement("button");
    b.className="piece";
    b.disabled=count(type)>=need;
    b.innerHTML=`<span class="swatch" style="background:${t.color}"></span><span>${type} (${count(type)}/${need})</span>`;
    b.onclick=()=>choose(type);
    $("palette").appendChild(b);
  }
  renderSaved();
  validate();
}
function clickCell(x,y){
  const p=state.pieces.find(p=>occupied(p).some(c=>c.x===x&&c.y===y));
  state.selectedId=p?p.id:null;
  render();
}
function validate(){
  const need=config().pieces;
  const messages=[];
  for(const [type,n] of Object.entries(need)){
    const got=count(type);
    if(got!==n)messages.push(`${type}: ${got}/${n}`);
  }
  const all=Object.values(need).reduce((a,b)=>a+b,0);
  if(state.pieces.length===all&&!messages.length){
    $("status").className="status good";
    $("status").textContent="Board is complete and ready to save.";
  }else{
    $("status").className="status";
    $("status").textContent=messages.length?messages.join("\n"):"Board incomplete.";
  }
}
function setStatus(text,kind=""){
  $("status").className="status"+(kind?" "+kind:"");
  $("status").textContent=text;
}
function saveHistory(){
  state.history.push(snapshot());
  if(state.history.length>100)state.history.shift();
}
function undo(){
  if(!state.history.length)return;
  state.pieces=state.history.pop();
  state.selectedId=null;
  render();
}
function clearBoard(){
  if(!state.pieces.length)return;
  saveHistory();
  state.pieces=[];
  state.selectedId=null;
  render();
}
function rotateSelected(){
  const p=state.pieces.find(p=>p.id===state.selectedId);
  if(!p)return;
  saveHistory();
  const old=occupied(p);
  const next=!p.rotated;
  const t=TYPES[p.type];
  const w=next?t.h:t.w,h=next?t.w:t.h;
  let nx=p.x,ny=p.y;
  if(nx+w>state.cols)nx=state.cols-w;
  if(ny+h>state.rows)ny=state.rows-h;
  const test={...p,x:nx,y:ny,rotated:next};
  const blocked=occupied(test).some(a=>state.pieces.some(q=>q.id!==p.id&&occupied(q).some(b=>a.x===b.x&&a.y===b.y)));
  if(blocked){
    state.history.pop();
    setStatus("The rotated piece would overlap another piece.","error");
    return;
  }
  p.x=nx;p.y=ny;p.rotated=next;
  render();
}
function removeSelected(){
  if(!state.selectedId)return;
  saveHistory();
  state.pieces=state.pieces.filter(p=>p.id!==state.selectedId);
  state.selectedId=null;
  render();
}
function transformCell(x,y,cols,rows,t){
  switch(t){
    case 0:return [x,y];
    case 1:return [cols-1-x,y];
    case 2:return [x,rows-1-y];
    case 3:return [cols-1-x,rows-1-y];
    case 4:return [rows-1-y,x];
    case 5:return [y,cols-1-x];
    case 6:return [y, x];
    case 7:return [rows-1-y,cols-1-x];
  }
}
function transformPieces(pieces,cols,rows,t){
  return pieces.map(p=>{
    const cells=occupied(p).map(c=>{
      const [x,y]=transformCell(c.x,c.y,cols,rows,t);
      return {x,y};
    });
    const minX=Math.min(...cells.map(c=>c.x));
    const minY=Math.min(...cells.map(c=>c.y));
    const maxX=Math.max(...cells.map(c=>c.x));
    const maxY=Math.max(...cells.map(c=>c.y));
    const original=TYPES[p.type];
    const bw=maxX-minX+1,bh=maxY-minY+1;
    const rotated=(bw===original.h&&bh===original.w)?!p.rotated:p.rotated;
    return {type:p.type,x:minX,y:minY,rotated};
  });
}
function signature(template){
  const {cols,rows,pieces}=template;
  const transforms=cols===rows?[0,1,2,3,4,5,6,7]:[0,1,2,3];
  const forms=transforms.map(t=>{
    const ps=transformPieces(pieces,cols,rows,t).map(p=>`${p.type}@${p.x},${p.y},${p.rotated?1:0}`).sort();
    return `${template.version}|${template.level}|${cols}x${rows}|${ps.join(";")}`;
  });
  return forms.sort()[0];
}
function familyIdFor(template){
  return signature(template);
}
function makeTemplate(){
  return {
    id:crypto.randomUUID(),
    name:$("name").value.trim()||`Template ${library.length+1}`,
    version:state.version,
    level:state.level,
    cols:state.cols,
    rows:state.rows,
    pieces:state.pieces.map(p=>({type:p.type,x:p.x,y:p.y,rotated:!!p.rotated})),
    recordedAt:new Date().toISOString(),
    familyId:"",
    transformation:"identity"
  };
}
function normalizeType(type){
  if(TYPES[type])return type;
  return LEGACY_TYPE_MAP[type]||LEGACY_TYPE_MAP[String(type).trim()]||null;
}
function normalizeTemplate(raw){
  if(!raw||typeof raw!=="object"||!Array.isArray(raw.pieces))return null;
  const version=String(raw.version||"6");
  const level=Number(raw.level);
  const cols=Number(raw.cols),rows=Number(raw.rows);
  if(!CONFIG[version]||!CONFIG[version][level]||!Number.isInteger(cols)||!Number.isInteger(rows))return null;
  const pieces=[];
  for(const p of raw.pieces){
    const type=normalizeType(p.type);
    if(!type||!Number.isInteger(Number(p.x))||!Number.isInteger(Number(p.y)))return null;
    pieces.push({
      type,x:Number(p.x),y:Number(p.y),rotated:!!p.rotated
    });
  }
  const out={
    id:raw.id||crypto.randomUUID(),
    name:raw.name||"Unnamed template",
    version,
    level,
    cols,
    rows,
    pieces,
    recordedAt:raw.recordedAt||new Date().toISOString(),
    familyId:"",
    transformation:raw.transformation||"identity"
  };
  out.familyId=familyIdFor(out);
  return out;
}
function storage(){
  localStorage.setItem("lt_verified_templates_v1",JSON.stringify(library));
}
function renderSaved(){
  const wrap=$("saved");
  wrap.innerHTML="";
  const current=library.filter(t=>t.version===state.version&&Number(t.level)===Number(state.level)&&t.cols===state.cols&&t.rows===state.rows);
  if(!current.length){
    wrap.innerHTML='<div class="muted">No saved templates for this puzzle/grid.</div>';
    return;
  }
  current.forEach(t=>{
    const b=document.createElement("button");
    b.textContent=`${t.name} · ${t.id}`;
    b.onclick=()=>loadTemplate(t);
    wrap.appendChild(b);
  });
}
function loadTemplate(t){
  state.version=String(t.version);
  state.level=Number(t.level);
  $("version").value=state.version;
  levels();
  $("level").value=String(state.level);
  if(state.version==="6"&&state.level===4){
    $("dimensions").value=`${t.cols}x${t.rows}`;
  }
  dimensionsUI();
  state.pieces=t.pieces.map(p=>({...p,id:crypto.randomUUID()}));
  state.selectedId=null;
  state.history=[];
  $("name").value=t.name||"";
  render();
}
function levels(){
  const sel=$("level");
  sel.innerHTML="";
  Object.keys(CONFIG[state.version]).forEach(n=>{
    const o=document.createElement("option");
    o.value=n;o.textContent=`Level ${n}`;
    sel.appendChild(o);
  });
  if(!CONFIG[state.version][state.level])state.level=Number(Object.keys(CONFIG[state.version])[0]);
  sel.value=String(state.level);
}
function reset(){
  dimensionsUI();
  state.pieces=[];
  state.selectedId=null;
  state.history=[];
  $("name").value="";
  render();
}
function migrateLibrary(){
  const raw=localStorage.getItem("lt_verified_templates_v1");
  if(!raw)return;
  const backupKey="lt_verified_templates_v1_backup_original";
  if(!localStorage.getItem(backupKey)){
    localStorage.setItem(backupKey,raw);
  }

  let parsed;
  try{parsed=JSON.parse(raw)}catch{
    setStatus("Existing library could not be parsed. Original data was preserved in backup.","error");
    return;
  }
  if(!Array.isArray(parsed))return;

  const active=[];
  const seen=new Set();
  let normalized=0,duplicates=0,invalid=0;

  for(const rawTemplate of parsed){
    const t=normalizeTemplate(rawTemplate);
    if(!t){invalid++;continue;}
    if(JSON.stringify(t)!==JSON.stringify(rawTemplate))normalized++;
    const sig=signature(t);
    if(seen.has(sig)){
      duplicates++;
      continue;
    }
    seen.add(sig);
    active.push(t);
  }

  library=active;
  storage();

  if(normalized||duplicates||invalid){
    const parts=[];
    if(normalized)parts.push(`${normalized} normalized`);
    if(duplicates)parts.push(`${duplicates} symmetry duplicates removed`);
    if(invalid)parts.push(`${invalid} invalid record(s) skipped`);
    setStatus(`Library migration complete: ${parts.join(", ")}. Original library preserved in backup.`,"good");
  }
}
function saveTemplate(){
  const need=config().pieces;
  for(const [type,n] of Object.entries(need)){
    if(count(type)!==n){
      setStatus("Complete every required piece before saving.","error");
      return;
    }
  }
  const t=makeTemplate();
  t.familyId=familyIdFor(t);
  const sig=signature(t);
  if(library.some(existing=>signature(existing)===sig)){
    setStatus("That template already exists. Rotations and mirrors count as the same template.","error");
    return;
  }
  library.push(t);
  storage();
  $("name").value="";
  render();
  setStatus(`Saved ${t.name}.`,"good");
}
$("version").onchange=()=>{
  state.version=$("version").value;
  state.level=Number(Object.keys(CONFIG[state.version])[0]);
  levels();reset();
};
$("level").onchange=()=>{
  state.level=Number($("level").value);
  reset();
};
$("dimensions").onchange=()=>{dimensionsUI();reset()};
$("erase").onclick=removeSelected;
$("rotate").onclick=rotateSelected;
$("undo").onclick=undo;
$("clear").onclick=clearBoard;
$("save").onclick=saveTemplate;

$("export").onclick=()=>{
  const source="window.LT_TEMPLATES = "+JSON.stringify(library,null,2)+";\n";
  const blob=new Blob([source],{type:"text/javascript;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="templates.js";
  a.click();
  URL.revokeObjectURL(a.href);
};
$("import").onclick=()=>$("jsonfile").click();
$("jsonfile").onchange=async e=>{
  const file=e.target.files[0];
  if(!file)return;
  try{
    const text=await file.text();
    let data=text.trim();
    const match=data.match(/window\.LT_TEMPLATES\s*=\s*(\[[\s\S]*\])\s*;?\s*$/);
    if(match)data=match[1];
    let parsed=JSON.parse(data);
    if(parsed&&Array.isArray(parsed.templates))parsed=parsed.templates;
    if(!Array.isArray(parsed))throw new Error("Expected an array of templates.");

    const seen=new Set(library.map(signature));
    let added=0,duplicates=0,invalid=0;
    for(const raw of parsed){
      const t=normalizeTemplate(raw);
      if(!t){invalid++;continue;}
      const sig=signature(t);
      if(seen.has(sig)){duplicates++;continue;}
      seen.add(sig);
      library.push(t);
      added++;
    }
    storage();
    render();
    setStatus(`Imported ${added} unique template(s); ${duplicates} duplicate(s) skipped${invalid?`; ${invalid} invalid record(s) skipped`:""}.`,"good");
  }catch(err){
    setStatus(`Import failed: ${err.message}`,"error");
  }finally{
    e.target.value="";
  }
};
$("photo").onchange=e=>{
  const f=e.target.files[0];
  if(!f)return;
  $("screenshot").src=URL.createObjectURL(f);
  $("screenshot").style.display="block";
};

migrateLibrary();
levels();
$("version").value=state.version;
$("level").value=String(state.level);
reset();
</script>
</body>
</html>
